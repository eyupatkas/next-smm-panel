<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1526;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0f1e;stop-opacity:1" />
    </linearGradient>
    <!-- Blue glow left -->
    <radialGradient id="glowLeft" cx="20%" cy="40%" r="40%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0" />
    </radialGradient>
    <!-- Purple glow right -->
    <radialGradient id="glowRight" cx="85%" cy="60%" r="35%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0" />
    </radialGradient>
    <!-- Line gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:#8b5cf6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0" />
    </linearGradient>
    <!-- Bar chart gradient -->
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.2" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.2" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.2" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.6" />
    </linearGradient>
    <filter id="blur1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#glowLeft)" />
  <rect width="1200" height="630" fill="url(#glowRight)" />

  <!-- Grid lines (subtle) -->
  <g opacity="0.04" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Decorative dots grid (top-right area) -->
  <g opacity="0.12" fill="#94a3b8">
    <circle cx="820" cy="60" r="2"/><circle cx="850" cy="60" r="2"/><circle cx="880" cy="60" r="2"/><circle cx="910" cy="60" r="2"/><circle cx="940" cy="60" r="2"/><circle cx="970" cy="60" r="2"/>
    <circle cx="820" cy="90" r="2"/><circle cx="850" cy="90" r="2"/><circle cx="880" cy="90" r="2"/><circle cx="910" cy="90" r="2"/><circle cx="940" cy="90" r="2"/><circle cx="970" cy="90" r="2"/>
    <circle cx="820" cy="120" r="2"/><circle cx="850" cy="120" r="2"/><circle cx="880" cy="120" r="2"/><circle cx="910" cy="120" r="2"/><circle cx="940" cy="120" r="2"/><circle cx="970" cy="120" r="2"/>
    <circle cx="820" cy="150" r="2"/><circle cx="850" cy="150" r="2"/><circle cx="880" cy="150" r="2"/><circle cx="910" cy="150" r="2"/><circle cx="940" cy="150" r="2"/><circle cx="970" cy="150" r="2"/>
  </g>

  <!-- Right side: Analytics chart panel -->
  <rect x="660" y="140" width="460" height="360" rx="20" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Chart area top bar -->
  <rect x="660" y="140" width="460" height="48" rx="20" fill="#ffffff" fill-opacity="0.04"/>
  <circle cx="692" cy="164" r="5" fill="#ef4444" fill-opacity="0.7"/>
  <circle cx="712" cy="164" r="5" fill="#eab308" fill-opacity="0.7"/>
  <circle cx="732" cy="164" r="5" fill="#22c55e" fill-opacity="0.7"/>
  <text x="780" y="169" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Büyüme Analitikleri · 2025</text>

  <!-- Bar chart bars -->
  <!-- Bar 1 -->
  <rect x="702" y="340" width="32" height="90" rx="6" fill="url(#barGrad1)"/>
  <!-- Bar 2 -->
  <rect x="754" y="300" width="32" height="130" rx="6" fill="url(#barGrad2)"/>
  <!-- Bar 3 -->
  <rect x="806" y="270" width="32" height="160" rx="6" fill="url(#barGrad1)"/>
  <!-- Bar 4 -->
  <rect x="858" y="240" width="32" height="190" rx="6" fill="url(#barGrad3)"/>
  <!-- Bar 5 -->
  <rect x="910" y="210" width="32" height="220" rx="6" fill="url(#barGrad2)"/>
  <!-- Bar 6 -->
  <rect x="962" y="185" width="32" height="245" rx="6" fill="url(#barGrad1)"/>
  <!-- Bar 7 -->
  <rect x="1014" y="200" width="32" height="230" rx="6" fill="url(#barGrad3)"/>
  <!-- Bar 8 -->
  <rect x="1066" y="175" width="32" height="255" rx="6" fill="url(#barGrad2)"/>

  <!-- Sparkline over bars -->
  <polyline points="718,340 770,295 822,265 874,235 926,205 978,182 1030,196 1082,172"
    fill="none" stroke="url(#sparkGrad)" stroke-width="2.5" filter="url(#glow)" opacity="0.8"/>
  <!-- Sparkline dots -->
  <circle cx="718" cy="340" r="4" fill="#3b82f6" filter="url(#glow)"/>
  <circle cx="770" cy="295" r="4" fill="#3b82f6" filter="url(#glow)"/>
  <circle cx="822" cy="265" r="4" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="874" cy="235" r="4" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="926" cy="205" r="4" fill="#8b5cf6" filter="url(#glow)"/>
  <circle cx="978" cy="182" r="4" fill="#8b5cf6" filter="url(#glow)"/>
  <circle cx="1030" cy="196" r="4" fill="#8b5cf6" filter="url(#glow)"/>
  <circle cx="1082" cy="172" r="5" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#glow)"/>

  <!-- Mini stat cards -->
  <rect x="680" y="460" width="120" height="22" rx="6" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1"/>
  <text x="740" y="475" font-family="system-ui,sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle">↑ 142% Büyüme</text>

  <rect x="818" y="460" width="120" height="22" rx="6" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1"/>
  <text x="878" y="475" font-family="system-ui,sans-serif" font-size="11" fill="#c4b5fd" text-anchor="middle">★ 4.9 Puan</text>

  <rect x="956" y="460" width="140" height="22" rx="6" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1"/>
  <text x="1026" y="475" font-family="system-ui,sans-serif" font-size="11" fill="#67e8f9" text-anchor="middle">⚡ 50K+ Kullanıcı</text>

  <!-- Left side content -->
  <!-- Brand badge -->
  <rect x="80" y="140" width="130" height="30" rx="15" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1"/>
  <text x="145" y="160" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#93c5fd" text-anchor="middle">✦ TakipUp Blog</text>

  <!-- Main title placeholder lines (represent "title") -->
  <rect x="80" y="195" width="480" height="16" rx="8" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="80" y="224" width="420" height="16" rx="8" fill="#ffffff" fill-opacity="0.09"/>
  <rect x="80" y="253" width="340" height="16" rx="8" fill="#ffffff" fill-opacity="0.06"/>

  <!-- Divider line -->
  <rect x="80" y="296" width="500" height="1" fill="url(#lineGrad)"/>

  <!-- Excerpt lines -->
  <rect x="80" y="318" width="440" height="10" rx="5" fill="#475569" fill-opacity="0.6"/>
  <rect x="80" y="340" width="400" height="10" rx="5" fill="#475569" fill-opacity="0.5"/>
  <rect x="80" y="362" width="320" height="10" rx="5" fill="#475569" fill-opacity="0.4"/>

  <!-- Social icons row -->
  <!-- Instagram icon (simplified) -->
  <rect x="80" y="420" width="44" height="44" rx="12" fill="#e1306c" fill-opacity="0.15" stroke="#e1306c" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="92" y="432" width="20" height="20" rx="5" fill="none" stroke="#f472b6" stroke-width="1.5"/>
  <circle cx="102" cy="442" r="5" fill="none" stroke="#f472b6" stroke-width="1.5"/>
  <circle cx="110" cy="434" r="1.5" fill="#f472b6"/>

  <!-- TikTok icon (simplified) -->
  <rect x="140" y="420" width="44" height="44" rx="12" fill="#010101" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
  <text x="162" y="448" font-family="system-ui,sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="700">♪</text>

  <!-- YouTube icon (simplified) -->
  <rect x="200" y="420" width="44" height="44" rx="12" fill="#ff0000" fill-opacity="0.15" stroke="#ff0000" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="212" y="432" width="20" height="20" rx="4" fill="#f87171" fill-opacity="0.4"/>
  <polygon points="218,436 226,442 218,448" fill="#f87171"/>

  <!-- Twitter/X icon (simplified) -->
  <rect x="260" y="420" width="44" height="44" rx="12" fill="#1d9bf0" fill-opacity="0.15" stroke="#1d9bf0" stroke-opacity="0.3" stroke-width="1"/>
  <text x="282" y="447" font-family="system-ui,sans-serif" font-size="16" fill="#60a5fa" text-anchor="middle" font-weight="700">𝕏</text>

  <!-- CTA button -->
  <rect x="80" y="490" width="160" height="40" rx="20" fill="#3b82f6" fill-opacity="0.9"/>
  <text x="160" y="515" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Devamını Oku →</text>

  <!-- Bottom glow line -->
  <rect x="0" y="620" width="1200" height="2" fill="url(#lineGrad)" opacity="0.5"/>

  <!-- Floating dots (decorative) -->
  <circle cx="560" cy="200" r="3" fill="#3b82f6" fill-opacity="0.5" filter="url(#glow)"/>
  <circle cx="590" cy="310" r="2" fill="#8b5cf6" fill-opacity="0.6"/>
  <circle cx="545" cy="380" r="4" fill="#06b6d4" fill-opacity="0.3"/>
  <circle cx="620" cy="450" r="2.5" fill="#3b82f6" fill-opacity="0.4"/>

  <!-- Corner accent -->
  <path d="M0,0 L120,0 L0,120 Z" fill="#3b82f6" fill-opacity="0.04"/>
  <path d="M1200,630 L1080,630 L1200,510 Z" fill="#8b5cf6" fill-opacity="0.04"/>
</svg>
